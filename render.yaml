services:
  # -----------------------------------------------------------------
  # ReachInbox API Service
  # -----------------------------------------------------------------
  - type: web
    name: reachinbox-api
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build -w packages/shared && npm run build -w apps/api
    startCommand: npx prisma db push --skip-generate && npm run start -w apps/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: WORKER_CONCURRENCY
        value: 10
      - key: MIN_SEND_DELAY_MS
        value: 2000
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: 200

  # -----------------------------------------------------------------
  # ReachInbox Web Static Frontend
  # -----------------------------------------------------------------
  - type: web
    name: reachinbox-web
    env: static
    buildCommand: npm install && npm run build -w packages/shared && npm run build -w apps/web
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # -----------------------------------------------------------------
  # Managed PostgreSQL Database
  # -----------------------------------------------------------------
  - name: reachinbox-db
    plan: free
    region: oregon
    databaseName: reachinbox
    user: reachinbox
