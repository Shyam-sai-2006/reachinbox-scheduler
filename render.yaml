services:
  # -----------------------------------------------------------------
  # ReachInbox Full-Stack Web Service (API + Bull Board + Web Frontend)
  # -----------------------------------------------------------------
  - type: web
    name: reachinbox-api
    env: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma db push --skip-generate && npm run start -w apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: WORKER_CONCURRENCY
        value: 10
      - key: MIN_SEND_DELAY_MS
        value: 2000
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: 200

databases:
  # -----------------------------------------------------------------
  # Managed PostgreSQL Database (Free Tier)
  # -----------------------------------------------------------------
  - name: reachinbox-db
    plan: free
    region: oregon
    databaseName: reachinbox
    user: reachinbox
